        }

        #exitbtn {

#controls {

}

    width: 60px;
    height: 60px;
    margin: 3px;
    font-size: 25px;
    border: none;
    border-radius: 10px;
    background-color: #333;
    color: white;
    touch-action: none;
}

@media (max-width: 1024px) {
    #game {
        width: 95vw;
        height: auto;
    }

    #controls {
        display: block;
    }
}
    </style>

        // =========================

            keys[event.key.toLowerCase()] = true;
        });


        document.addEventListener("keyup", function (event) {
            keys[event.key.toLowerCase()] = false;
        });


        // =========================
        // DRAW
        // =========================

        function draw() {

            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            // EXIT

            ctx.fillStyle = "green";

            ctx.fillRect(
                exit.x,
                exit.y,
                exit.width,
                exit.height
            );


            // PLAYER

            ctx.fillStyle = playerColor;

            ctx.fillRect(
                player.x,
                player.y,
                player.width,
                player.height
            );


            // WALLS

            ctx.fillStyle = "gray";

            walls.forEach(function (wall) {

                ctx.fillRect(
                    wall.x,
                    wall.y,
                    wall.width,
                    wall.height
                );

            });


            // PORTALS

            portals.forEach(function (portal) {

                ctx.fillStyle = portal.color;

                ctx.fillRect(
                    portal.x,
                    portal.y,
                    portal.width,
                    portal.height
                );

            });


            // DANGERS

            ctx.fillStyle = "orange";

            dangers.forEach(function (danger) {

                ctx.fillRect(
                    danger.x,
                    danger.y,
                    danger.width,
                    danger.height
                );

            });

        }


        // =========================
        // COLLISION
        // =========================

        function isColliding(player, object) {

            return (
                player.x < object.x + object.width &&
                player.x + player.width > object.x &&
                player.y < object.y + object.height &&
                player.y + player.height > object.y
            );

        }


        // =========================
        // UPDATE
        // =========================

        function update() {

            // Portal cooldown

            if (portalCooldown > 0) {
                portalCooldown--;
            }


            // =========================
            // PORTALS
            // =========================

            if (portalCooldown === 0) {

                for (let portal of portals) {

                    if (isColliding(player, portal)) {

                        player.x = portal.targetX;
                        player.y = portal.targetY;

                        portalCooldown = 30;

                        break;
                    }
                }
            }


            // =========================
            // DANGERS
            // =========================

            for (let danger of dangers) {

                if (isColliding(player, danger)) {

                    player.x = 30;
                    player.y = 115;

                }
            }


            // =========================
            // EXIT
            // =========================

            if (isColliding(player, exit)) {

                window.location.href = "win.html";

            }


            // =========================
            // RIGHT
            // =========================

            if (keys["d"] || keys["arrowright"]) {

                let oldX = player.x;

                player.x += player.speed;

                for (let wall of walls) {

                    if (isColliding(player, wall)) {

                        player.x = oldX;

                    }

                }
            }


            // =========================
            // LEFT
            // =========================

            if (keys["a"] || keys["arrowleft"]) {

                let oldX = player.x;

                player.x -= player.speed;

                for (let wall of walls) {

                    if (isColliding(player, wall)) {

                        player.x = oldX;

                    }

                }
            }


            // =========================
            // UP
            // =========================

            if (keys["w"] || keys["arrowup"]) {

                let oldY = player.y;

                player.y -= player.speed;

                for (let wall of walls) {

                    if (isColliding(player, wall)) {

                        player.y = oldY;

                    }

                }
            }


            // =========================
            // DOWN
            // =========================

            if (keys["s"] || keys["arrowdown"]) {

                let oldY = player.y;

                player.y += player.speed;

                for (let wall of walls) {

                    if (isColliding(player, wall)) {

                        player.y = oldY;

                    }

                }
            }

        }


        // =========================
        // GAME LOOP
        // =========================

        function gameLoop() {

            update();
            draw();

            requestAnimationFrame(gameLoop);

        }


        gameLoop();
