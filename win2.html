<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Level Complete</title>

    <style>

        body {
            margin: 0;

            background-color: hsl(0, 0%, 10%);
            color: white;

            font-family: Arial;

            display: flex;
            justify-content: center;
            align-items: center;

            height: 100vh;
        }

        #completeBox {
            background-color: hsl(0, 0%, 20%);

            padding: 40px;

            border-radius: 15px;

            width: 350px;

            text-align: center;
        }

        h1 {
            font-size: 40px;
            margin-bottom: 10px;
        }

        button {
            width: 100%;

            padding: 14px;

            margin-top: 12px;

            border: none;
            border-radius: 8px;

            background-color: hsl(205, 100%, 50%);

            color: white;

            font-size: 18px;

            cursor: pointer;
        }

        button:hover {
            background-color: hsl(205, 100%, 60%);
        }

        #accountBtn {
            background-color: hsl(0, 0%, 35%);
        }

        #accountBtn:hover {
            background-color: hsl(0, 0%, 45%);
        }

    </style>

</head>

<body>


<div id="completeBox">

    <h1>🎉</h1>

    <h2>Level Complete!</h2>

    <p id="levelName"></p>


    <button id="replayBtn">
        🔄 Replay
    </button>


    <button id="accountBtn">
        👤 Back to Account
    </button>

    
    <button id="back" onclick="back()">
        Back
    </button>

</div>


<script>

    const level =
        JSON.parse(
            localStorage.getItem("playingLevel")
        );


    if (level) {

        document.getElementById(
            "levelName"
        ).textContent =
            level.name;

    }


    // REPLAY

    document.getElementById(
        "replayBtn"
    ).addEventListener(
        "click",
        function() {

            window.location.href =
                "playlevel.html";

        }
    );


    // BACK TO ACCOUNT

    document.getElementById(
        "accountBtn"
    ).addEventListener(
        "click",
        function() {

            window.location.href =
                "account.html";

        }
    );

       // BACK

    document.getElementById(
        "back"
    ).addEventListener(
        "click",
        function() {

            window.location.href =
                "search.html";

        }
    );

</script>


</body>
</html>
