<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Account</title>

    <style>

        body {
            background-color: hsl(0, 0%, 10%);
            color: white;
            font-family: Arial;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
            margin: 0;
        }

        #accountBox {
            background-color: hsl(0, 0%, 20%);
            padding: 30px;
            border-radius: 10px;
            width: 350px;
            text-align: center;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;

            border: none;
            border-radius: 7px;

            background-color: hsl(205, 100%, 50%);
            color: white;

            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: hsl(205, 100%, 60%);
        }

        #logoutBtn {
            background-color: hsl(0, 70%, 50%);
        }

        #homeBtn {
            background-color: hsl(0, 0%, 35%);
        }

        .levelButton {
            background-color: hsl(280, 70%, 50%);
        }

        #myLevels {
            margin-top: 10px;
        }

    </style>

</head>

<body>

<div id="accountBox">

    <h1>Account</h1>


    <!-- NOT LOGGED IN -->

    <div id="loggedOut">

        <button onclick="window.location.href='signup.html'">
            Sign Up
        </button>

        <button onclick="window.location.href='login.html'">
            Log In
        </button>

    </div>


    <!-- LOGGED IN -->

    <div id="loggedIn">

        <h2>Welcome!</h2>

        <p id="usernameText"></p>

        <h2>My Levels</h2>

        <div id="myLevels"></div>

        <button id="logoutBtn">
            Log Out
        </button>

    </div>


    <button id="homeBtn" onclick="window.location.href='index.html'">
        🏠 Back to Home
    </button>

</div>


<script>

const loggedInUser = localStorage.getItem("loggedInUser");

const loggedOut = document.getElementById("loggedOut");
const loggedIn = document.getElementById("loggedIn");


// ==========================
// NOT LOGGED IN
// ==========================

if (!loggedInUser) {

    loggedOut.style.display = "block";
    loggedIn.style.display = "none";

}


// ==========================
// LOGGED IN
// ==========================

else {

    loggedOut.style.display = "none";
    loggedIn.style.display = "block";

    document.getElementById("usernameText").textContent =
        "Username: " + loggedInUser;


    // GET ALL LEVELS

    const allLevels =
        JSON.parse(localStorage.getItem("levels")) || [];


    // ONLY THIS USER'S LEVELS

    const myLevels =
        allLevels.filter(function(level) {

            return level.creator === loggedInUser;

        });


    const levelsContainer =
        document.getElementById("myLevels");


    // NO LEVELS

    if (myLevels.length === 0) {

        levelsContainer.textContent =
            "You haven't created any levels yet.";

    }


    // SHOW LEVELS

    else {

        myLevels.forEach(function(level) {

            const button =
                document.createElement("button");

            button.className =
                "levelButton";

            button.textContent =
                level.name;


            // CLICK LEVEL TO PLAY

            button.addEventListener("click", function() {

                localStorage.setItem(
                    "playingLevel",
                    JSON.stringify(level)
                );

                window.location.href =
                    "playlevel.html";

            });


            levelsContainer.appendChild(button);

        });

    }

}


// ==========================
// LOG OUT
// ==========================

document.getElementById("logoutBtn").addEventListener(
    "click",
    function() {

        localStorage.removeItem("loggedInUser");

        window.location.href = "index.html";

    }
);

</script>

</body>

</html>
