<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>superdotmaze</title>
    <style>
    
    .levels{
        background-color: hsl(205, 100%, 50%);
        border: none;
        border-radius: 5px;
        width: 60px;
        height: 35px;
        color: white;
        cursor: pointer;
    }

    .levels:active{
        background-color: hsl(205, 100%, 60%);
    }
  body {
    background-color: hsl(0, 0%, 10%);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

#con {
    background-color: hsl(0, 0%, 20%);
    padding: 30px;
    border-radius: 10px;
}
#colors{
    transform: translateX(-350px);
}

#menu{
    font-size: 30px;
    height: auto;
    width: auto;
}

#accountBtn {
    position: fixed;
    bottom: 15px;
    left: 15px;

    background-color: hsl(205, 100%, 50%);
    color: white;

    border: none;
    border-radius: 8px;

    padding: 12px 18px;
    font-size: 16px;

    cursor: pointer;
}

#accountBtn:hover {
    background-color: hsl(205, 100%, 55%);
}
</style>
</head>
<body>
    
    <div id="con">
    <a href="le1plyw.html">
        <button class="levels">level1</button>
    </a>

    <a href="level2.html"><button class="levels">level2</button></a>
    <a href="level3.html"><button class="levels">level3</button></a><br><br>
    <a href="level4.html"><button class="levels" class="btmbtn">level4</button></a>
    <a href="level5.html"><button class="levels">level5</button></a>
    <a href="level6.html"><button class="levels">level6</button></a><br><br>
    <a href="level7.html"><button class="levels">level7</button></a>
    </div>

    <a href="colors.html"><button class="levels" id="colors">colors</button></a>
    <a href="levels.html"><button id="menu" class="levels">🛠️</button></a>
    <button id="accountBtn">Account</button>

    
    
    
    <script>const accountBtn = document.getElementById("accountBtn");

    const loggedInUser = localStorage.getItem("loggedInUser");

    if (loggedInUser) {
        accountBtn.textContent = loggedInUser;
    }

    accountBtn.addEventListener("click", function () {
        window.location.href = "account.html";
    });
    </script>
</body>
</html>
