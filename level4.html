    <style>body{

    }
        
  #exitbtn {
    position: fixed;
    top: 10px;
    left: 10px;

    background-color: hsl(0, 0%, 20%);
    border: none;
    border-radius: 5px;
    color: hsl(0, 0%, 87%);

   font-size: medium;
    cursor: pointer;
}

#game {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
}

#controls {
    display: none;
    position: fixed;
    bottom: 20px;
    left: 20px;
    text-align: center;
}

#controls button {
    width: 60px;
    height: 60px;
    margin: 3px;
    font-size: 25px;
    border: none;
    border-radius: 10px;
    background-color: #333;
    color: white;
    touch-action: none;
}

/* רק טלפונים וטאבלטים */
@media (max-width: 1024px) {
    #controls {
        display: block;
    }
}</style>

<body>
<div id="controls">
    <button data-key="w">⬆</button>

    <div>
        <button data-key="a">⬅</button>
        <button data-key="s">⬇</button>
        <button data-key="d">➡</button>
    </div>
</div>

<a href="index.html">
    <button id="exitbtn">&#10094;</button>
</a>

<canvas id="game" width="1270" height="525"></canvas>
    <script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

    let exit = {
    x: 1220,
    y: 230,
    width: 50,
    height: 50
};

let player = {
    x: 100,
    y: 100,
    width: 20,
    height: 20,
    speed: 2
};

 let keys = {};
        const buttons = document.querySelectorAll("#controls button");

buttons.forEach(button => {

    const key = button.dataset.key;

    button.addEventListener("touchstart", function(event) {
        event.preventDefault();
        keys[key] = true;
    });

    button.addEventListener("touchend", function(event) {
        event.preventDefault();
        keys[key] = false;
    });

    button.addEventListener("touchcancel", function(event) {
        event.preventDefault();
        keys[key] = false;
    });
});


    
let playerColor = localStorage.getItem("playerColor") || "red";
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);




ctx.fillStyle = "green";

ctx.fillRect(
    exit.x,
    exit.y,
    exit.width,
    exit.height
);

    // player
     ctx.fillStyle = playerColor;
    ctx.fillRect(
        player.x,
        player.y,
        player.width,
        player.height
    );

ctx.fillStyle = "gray"
walls.forEach(wall => {
    ctx.fillRect(
        wall.x,
        wall.y,
        wall.width,
        wall.height
    );
})


ctx.fillStyle = "orange";

    dangers.forEach(danger => {
        ctx.fillRect(
            danger.x,
            danger.y,
            danger.width,
            danger.height
        );
    });
};

];


document.addEventListener("keydown", function(event) {
    keys[event.key.toLowerCase()] = true;
});

document.addEventListener("keyup", function(event) {
    keys[event.key.toLowerCase()] = false;
});

function update(){


    for (let danger of dangers) {
    if (isColliding(player, danger)) {
        player.x = 50;
        player.y = 100;
    }
}

    if (isColliding(player, exit)) {
    window.location.href ="win.html";
}

         if (keys["d"] || keys["arrowright"]) {
        let oldX = player.x;
        player.x += player.speed;

        for (let wall of walls) {
            if (isColliding(player, wall)) {
                player.x = oldX;
            }
        }
    }

    // A - שמאלה
    if (keys["a"] || keys["arrowleft"]) {
        let oldX = player.x;
        player.x -= player.speed;

        for (let wall of walls) {
            if (isColliding(player, wall)) {
                player.x = oldX;
            }
        }
    }

    // W - למעלה
    if (keys["w"] || keys["arrowup"]) {
        let oldY = player.y;
        player.y -= player.speed;

        for (let wall of walls) {
            if (isColliding(player, wall)) {
                player.y = oldY;
            }
        }
    }

    // S - למטה
    if (keys["s"] || keys["arrowdown"]) {
        let oldY = player.y;
        player.y += player.speed;

        for (let wall of walls) {
            if (isColliding(player, wall)) {
                player.y = oldY;
            }
        }
    }
}



function gameLoop() {
    update();
    draw();

    requestAnimationFrame(gameLoop);
}

function isColliding(player, wall) {
    return (
        player.x < wall.x + wall.width &&
        player.x + player.width > wall.x &&
        player.y < wall.y + wall.height &&
        player.y + player.height > wall.y
    );
}

gameLoop();

localStorage.setItem("lastLevel", "level4");
